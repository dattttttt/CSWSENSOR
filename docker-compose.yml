# docker-compose.yml
version: "3.8"

services:
  mongo:
    image: mongo
    container_name: csw-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: csw-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: csw-frontend
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
